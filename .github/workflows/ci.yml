name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# ⚠️ 这里**故意不加 concurrency**。两次尝试的实测结论（2026-10-05）：
#
#   现象：run #74/#75 均为 created→updated 恰好 15分03秒/15分02秒，
#        job 从未 started，conclusion=cancelled，而本地 check:release 全绿。
#        对照 run #73（单跑）从创建到完成 81 秒，runner 秒接。
#        ⇒ GitHub 侧 runner 排队超过 15 分钟上限，job 被判 cancelled。
#        积压原因是网络不稳期间多个推送一次性进来。
#
#   试过 cancel-in-progress: true（run #76/#77）：**反而更糟**。
#        run #76 的 job started 与 created 同一秒就被取消（20:30:12→20:45:14），
#        新推送会杀掉正在验证上一个提交的 run，得不到任何有效结论。
#
#   结论：这是 GitHub 基础设施的排队问题，不是本仓库配置能根治的。
#        正确处置是**别让多个推送堆在一起**（本地先跑 check:release 再推、
#        网络断时退避重试），而不是在 workflow 里加开关。
#        若将来 CI 真的需要「只跑最新」，应当用 cancel-in-progress: false
#        （排队不取消），而不是 true。

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 默认 depth 1 会让下面的 append-only 检查拿不到基准 ref；这里必须全量
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        # v0.9.16：不再 --omit=optional——省流装法会把 rollup 的 win32 平台二进制
        # （optional 依赖）一起省掉，vitest 直接起不来（npm/cli#4828 的经典坑）；
        # 此前靠"补装 transformers"的副作用顺带修复，纯属侥幸。改为全量安装，
        # optional 类型缺失的兜底见 src/types/optional-deps.d.ts（用户侧保险）。
        run: npm ci --no-fund --no-audit

      - name: Type check (tsc)
        run: npx tsc -b

      - name: Lint (eslint)
        run: npm run lint

      - name: Format check (prettier)
        # 2026-10-05：fmt 脚本一直存在但 lint/CI 从未校验格式，存量漂移了 57 处
        # （已一次性格式化，见 commit edfec2c）。这一步是防复发——没有它，
        # 下次谁跑一次未格式化的编辑器改动就又漂回去了。
        run: npx prettier --check "src/**/*.{ts,tsx,css}" "*.{ts,tsx,json,mjs}" "vite.config.ts"

      - name: Regex self-check (字符类提前闭合)
        # 2026-10-05：classify-genre.ts 的冒号台词正则字符类写了 `（）()【】[]]`，
        # 类内裸 `[` 让 `]` 提前收尾 —— 整条正则恒不匹配，对话体判定少了一条主特征。
        # 这类缺陷 lint 和覆盖率都抓不到：行被执行了（行覆盖率 100%），
        # 只是结果永远错；eslint 甚至会对正确的 `\[` 报 no-useless-escape（误报）。
        # 详见 scripts/check-regex-defects.ts。
        run: npm run check:regex

      - name: Version consistency (版本号落点)
        # 2026-10-13 补：版本号有 6+1 处落点（根/electron-app 两处 package.json、README 标题行、
        # README 文末"当前版本"、CHANGELOG 本版章节、产物 resources/app/package.json；
        # 第七处 SKILL.md metadata.version 是手动的，由 skill-md.test.ts 守）。
        # 此前只在本机 check:release 里跑，CI 链独缺它 —— 结果就是"漏改一处在 CI 上完全看不见",
        # 历史上 README 落点漏过三次（v0.9.16/18/19），才攒出这条门禁。
        # 干净检出下没有 electron-dist 产物 ⇒ 产物落点自动跳过（check-version-sync.ts 的设计），
        # 本地发布流程里那处照常校验。
        run: npm run check:version

      - name: Unit tests (vitest, with coverage gate)
        # coverage 阈值在 scripts/coverage-thresholds.ts（**唯一事实源**，v0.9.16 起收拢），
        # 2026-10-05 从 75×4 收紧到 93/87/94/94——阈值贴着实际值（实测 97.4/91.6/98.8/98.2）
        # 门禁才有牙齿；低于它即红，只许变好。改阈值请先写清为什么不是回退。
        run: npx vitest run --coverage

      - name: Engine regression (scan-bugs, fast)
        run: npx tsx scripts/scan-bugs.ts
        env:
          SCAN_TIER: fast

      - name: 12-sample regression (D 评分器漂移棘轮 / E 引擎退化棘轮)
        run: npx tsx scripts/regression-12samples.ts

      - name: Quality gate (verify-quality)
        run: npx tsx scripts/verify-quality.ts

      # 零外部 key 的自证门禁：同一把本地尺下「改写稿比原文更不像 AI」（相对改善率）。
      # 与朱雀官方送检无关、不依赖任何 Key —— 官方送检卡住时它是唯一还在跑的能力自证。
      - name: Relative improvement (相对改善自证 · 零 key)
        run: npx tsx scripts/regression-improve.ts --samples scripts/regression-improve.samples.json

      - name: Calibration sanity (标定数据源/参数/漂移自检)
        run: npx tsx scripts/calib-sanity.ts

      - name: Evidence audit (官方送检凭证哈希复算 + 页面原文互证)
        run: npx tsx scripts/zhuque-evidence.ts audit

      - name: Ledger append-only (凭证账本历史行不可改)
        # 默认模式比的是 HEAD vs 干净检出的工作区——在 CI 上永远相等，等于没查。
        # 所以这里显式给基准：PR 比目标分支，push 比推送前的那个 SHA。
        # 拿不到基准时宁可显式警告并跳过，也不假装查过了。
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            BASE="origin/${{ github.base_ref }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            BASE="${{ github.event.before }}"
          else
            echo "::warning::首次推送、没有可比基准——本轮 append-only 检查不覆盖任何东西"
            exit 0
          fi
          npx tsx scripts/check-ledger-appendonly.ts --head-ref "$BASE"

      - name: Production build
        run: npm run build
