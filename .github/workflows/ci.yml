name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 默认 depth 1 会让下面的 append-only 检查拿不到基准 ref；这里必须全量
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (without optional PPL deps)
        run: npm ci --no-fund --no-audit --omit=optional

      - name: Install optional deps for build only
        run: npm install @huggingface/transformers --no-save --no-fund --no-audit

      - name: Type check (tsc)
        run: npx tsc -b

      - name: Lint (eslint)
        run: npm run lint

      - name: Unit tests (vitest)
        run: npx vitest run

      - name: Engine regression (scan-bugs, fast)
        run: npx tsx scripts/scan-bugs.ts
        env:
          SCAN_TIER: fast

      - name: 12-sample regression (D 评分器漂移棘轮 / E 引擎退化棘轮)
        run: npx tsx scripts/regression-12samples.ts

      - name: Quality gate (verify-quality)
        run: npx tsx scripts/verify-quality.ts

      - name: Calibration sanity (标定数据源/参数/漂移自检)
        run: npx tsx scripts/calib-sanity.ts

      - name: Evidence audit (官方送检凭证哈希复算 + 页面原文互证)
        run: npx tsx scripts/zhuque-evidence.ts audit

      - name: Ledger append-only (凭证账本历史行不可改)
        # 默认模式比的是 HEAD vs 干净检出的工作区——在 CI 上永远相等，等于没查。
        # 所以这里显式给基准：PR 比目标分支，push 比推送前的那个 SHA。
        # 拿不到基准时宁可显式警告并跳过，也不假装查过了。
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            BASE="origin/${{ github.base_ref }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            BASE="${{ github.event.before }}"
          else
            echo "::warning::首次推送、没有可比基准——本轮 append-only 检查不覆盖任何东西"
            exit 0
          fi
          npx tsx scripts/check-ledger-appendonly.ts --head-ref "$BASE"

      - name: Production build
        run: npm run build
